<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-label="Dark podcast studio with a microphone">
  <defs>
    <radialGradient id="light" cx="32%" cy="22%" r="62%">
      <stop offset="0" stop-color="#d6c1a3" stop-opacity=".52"/>
      <stop offset=".36" stop-color="#787e56" stop-opacity=".23"/>
      <stop offset=".72" stop-color="#08242b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#010203" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset=".6" stop-color="#050606"/>
      <stop offset="1" stop-color="#000"/>
