<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MADAMUA 化妝品形象廣告 - SU STUDIO</title>
    <link rel="stylesheet" href="archive-style.css" />
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">HOME</a>
      <a href="work.html" aria-current="page">WORK</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </nav>
    <main>
      <div class="wrap">
        <header class="archive-head">
          <a class="back" href="work.html" data-back-to-work>Back to Work</a>
          <h1 lang="zh-Hant">MADAMUA 化妝品形象廣告</h1>
          <div class="archive-meta">
            <span>2023</span>
            <span>PROJECT</span>
            <span>Experimental and mixed-format work</span>
          </div>
        </header>
        <section class="archive-section" aria-label="MADAMUA 化妝品形象廣告 PROJECT archive">
          <h2 class="section-label">PROJECT</h2>
          <div class="video-grid">
            <article class="video-card">
              <button class="video-frame" type="button" data-embed="https://www.youtube.com/embed/W-0HRQEEgw0" data-title="MADAMUA形象廣告 30秒正片版" aria-label="Play MADAMUA形象廣告 30秒正片版">
                <img src="https://i.ytimg.com/vi/W-0HRQEEgw0/hqdefault.jpg" alt="MADAMUA形象廣告 30秒正片版" loading="lazy" />
              </button>
              <div class="video-meta"><span class="video-title">MADAMUA形象廣告 30秒正片版</span><span class="year">2023</span></div>
            </article>
          </div>
        </section>
      </div>
    </main>
    <script>
      const backToWork = document.querySelector('[data-back-to-work]');
      if (backToWork) {
        backToWork.addEventListener('click', (event) => {
          const cameFromWork = document.referrer && document.referrer.includes('work.html');
          if (!cameFromWork) return;

          event.preventDefault();
          history.back();
        });
      }

      document.querySelectorAll('.video-frame').forEach((frame) => {
        frame.addEventListener('click', () => {
          const embed = frame.dataset.embed;
          const title = frame.dataset.title || 'SU STUDIO video';
          if (!embed || frame.classList.contains('is-playing')) return;

          const iframe = document.createElement('iframe');
          iframe.src = embed + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
          iframe.title = title;
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          iframe.allowFullscreen = true;

          frame.classList.add('is-playing');
          frame.replaceChildren(iframe);
        });
      });
    </script>
  </body>
</html>
