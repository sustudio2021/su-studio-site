    <main>
      <div class="wrap">
        <header class="archive-head">
          <a class="back" href="work.html" data-back-to-work>Back to Work</a>
          <h1 lang="zh-Hant">N楚立功</h1>
          <div class="archive-meta">
            <span>2024-2025</span>
            <span>YOUTUBE</span>
            <span>Long-form horizontal content</span>
          </div>
        </header>
        <section class="archive-section" aria-label="N楚立功 YOUTUBE archive">
          <h2 class="section-label">YOUTUBE</h2>
          <div class="video-grid">
            <article class="video-card">
              <button class="video-frame" type="button" data-embed="https://www.youtube.com/embed/bga_zHJMiWc" data-title="店家在網路上被臭，店家要怎麼告｜刑事訴訟｜民事訴訟｜Ｎ楚立功" aria-label="Play 店家在網路上被臭，店家要怎麼告｜刑事訴訟｜民事訴訟｜Ｎ楚立功">
                <img src="https://i.ytimg.com/vi/bga_zHJMiWc/hqdefault.jpg" alt="店家在網路上被臭，店家要怎麼告｜刑事訴訟｜民事訴訟｜Ｎ楚立功" loading="lazy" />
              </button>
              <div class="video-meta"><span class="video-title">店家在網路上被臭，店家要怎麼告｜刑事訴訟｜民事訴訟｜Ｎ楚立功</span><span class="year">2025</span></div>
            </article>
            <article class="video-card">
              <button class="video-frame" type="button" data-embed="https://www.youtube.com/embed/_5S7f2P-jTI" data-title="打官司想分期付款嗎?｜刑事訴訟｜民事訴訟｜立功律師｜Ｎ楚立功【生存の法則EP56】" aria-label="Play 打官司想分期付款嗎?｜刑事訴訟｜民事訴訟｜立功律師｜Ｎ楚立功【生存の法則EP56】">
                <img src="https://i.ytimg.com/vi/_5S7f2P-jTI/hqdefault.jpg" alt="打官司想分期付款嗎?｜刑事訴訟｜民事訴訟｜立功律師｜Ｎ楚立功【生存の法則EP56】" loading="lazy" />
              </button>
              <div class="video-meta"><span class="video-title">打官司想分期付款嗎?｜刑事訴訟｜民事訴訟｜立功律師｜Ｎ楚立功【生存の法則EP56】</span><span class="year">2024</span></div>
            </article>
          </div>
        </section>
      </div>
    </main>
    <script>
      const backToWork = document.querySelector('[data-back-to-work]');
      if (backToWork) {
        backToWork.addEventListener('click', (event) => {
          const cameFromWork = document.referrer && document.referrer.includes('work.html');
          if (!cameFromWork) return;

          event.preventDefault();
          history.back();
        });
      }

      document.querySelectorAll('.video-frame').forEach((frame) => {
        frame.addEventListener('click', () => {
          const embed = frame.dataset.embed;
          const title = frame.dataset.title || 'SU STUDIO video';
          if (!embed || frame.classList.contains('is-playing')) return;

          const iframe = document.createElement('iframe');
          iframe.src = embed + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
          iframe.title = title;
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          iframe.allowFullscreen = true;

          frame.classList.add('is-playing');
          frame.replaceChildren(iframe);
        });
      });
    </script>
  </body>
</html>
