      <div class="wrap">
        <header class="archive-head">

          <h1 lang="zh-Hant">台灣達人秀/REDOU</h1>

            <span class="archive-meta-categories"><a class="archive-meta-link" href="#youtube">YOUTUBE</a></span>
            <span>Long-form horizontal content</span>
          </div>
        </header>
        <section class="archive-section" aria-label="台灣達人秀/REDOU YOUTUBE archive">
          <h2 class="section-label" id="youtube">YOUTUBE</h2>
          <div class="video-grid">
            <article class="video-card">
              <button class="video-frame" type="button" data-embed="https://www.youtube.com/embed/FAOvZQJ_jtI" data-title="【最網美的拍照景點 樂天女孩甜玩世界客家博覽會！】" aria-label="Play 【最網美的拍照景點 樂天女孩甜玩世界客家博覽會！】">
                <img src="https://i.ytimg.com/vi/FAOvZQJ_jtI/hqdefault.jpg" alt="【最網美的拍照景點 樂天女孩甜玩世界客家博覽會！】" loading="lazy" />
              </button>
              <div class="video-meta"><span class="video-title">【最網美的拍照景點 樂天女孩甜玩世界客家博覽會！】</span><span class="year">2023</span></div>
            </article>
          </div>
        </section>
      </div>
    </main>
    <script>
      const backToWork = document.querySelector('[data-back-to-work]');
      if (backToWork) {
        backToWork.addEventListener('click', (event) => {
          const cameFromWork = document.referrer && document.referrer.includes('work.html');
          if (!cameFromWork) return;

          event.preventDefault();
          history.back();
        });
      }

      document.querySelectorAll('.video-frame').forEach((frame) => {
        frame.addEventListener('click', () => {
          const embed = frame.dataset.embed;
          const title = frame.dataset.title || 'SU STUDIO video';
          if (!embed || frame.classList.contains('is-playing')) return;

          const iframe = document.createElement('iframe');
          iframe.src = embed + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
          iframe.title = title;
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          iframe.allowFullscreen = true;

          frame.classList.add('is-playing');
          frame.replaceChildren(iframe);
        });
      });
    </script>
