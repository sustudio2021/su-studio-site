    <style>
      :root {
        color-scheme: dark;
        --bg: #010203;
        --fg: #f2f4ef;
        --muted: rgba(242, 244, 239, 0.58);
        --soft: rgba(242, 244, 239, 0.76);
        --font-en: Inter, Helvetica, "Helvetica Neue", Arial, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 76% 18%, rgba(28, 78, 102, 0.2), transparent 34rem),
          radial-gradient(ellipse at 18% 78%, rgba(120, 126, 86, 0.12), transparent 40rem),
          linear-gradient(180deg, #010203 0%, #030405 54%, #010101 100%);
        color: var(--fg);
        font-family: var(--font-en);
        font-weight: 400;
        letter-spacing: 0.012em;
      }

      body::before {
        position: fixed;
        inset: -18%;
        z-index: -2;
        content: "";
        background:
          radial-gradient(ellipse at 74% 20%, transparent 0 30%, rgba(132, 213, 235, 0.12) 48%, transparent 74%),
          radial-gradient(ellipse at 22% 80%, transparent 0 34%, rgba(120, 126, 86, 0.12) 52%, transparent 74%);
        filter: blur(54px);
        opacity: 0.78;
      }

      body::after {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        content: "";
        background-image:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.024) 0 1px, transparent 1px 5px),
          radial-gradient(circle at 18% 34%, rgba(255, 255, 255, 0.1) 0 0.55px, transparent 1px);
        background-size: auto, 31px 31px;
        opacity: 0.18;
        mix-blend-mode: overlay;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-nav {
        position: absolute;
        top: clamp(40px, 5vw, 64px);
        right: clamp(40px, 5vw, 64px);
        z-index: 3;
        display: flex;
        gap: clamp(26px, 3vw, 42px);
        align-items: center;
        font-size: clamp(12px, 1vw, 14px);
        letter-spacing: 0.18em;
        line-height: 1;
        text-transform: uppercase;
      }

      .site-nav a {
        opacity: 0.66;
        transition: opacity 300ms ease;
      }

      .site-nav a:hover,
      .site-nav a:focus-visible,
      .site-nav a[aria-current="page"] {
        opacity: 1;
      }

      main {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        padding: clamp(40px, 5vw, 64px) clamp(22px, 6vw, 88px);
      }

      main::before {
        position: absolute;
        right: -16vw;
        bottom: -20vh;
        z-index: -1;
        width: min(84vw, 980px);
        height: min(70vw, 820px);
        pointer-events: none;
        content: "";
        background:
          radial-gradient(ellipse at 58% 42%, rgba(176, 216, 226, 0.12), transparent 32%),
          radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.82) 0 34%, transparent 52%),
          radial-gradient(ellipse at 50% 50%, transparent 0 42%, rgba(146, 190, 206, 0.12) 52%, transparent 70%);
        filter: blur(26px);
        opacity: 0.62;
        transform: rotate(-12deg);
      }

      .wrap {
        width: min(100%, 1120px);
        min-height: calc(100vh - clamp(80px, 10vw, 128px));
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(280px, 520px) minmax(320px, 480px);
        gap: clamp(58px, 8vw, 112px);
        align-items: start;
        padding-top: clamp(150px, 24vh, 240px);
        padding-bottom: clamp(64px, 10vh, 120px);
      }

      .contact-block {
        width: min(100%, 520px);
        margin-left: clamp(0px, 6vw, 90px);
      }

      p {
        margin: 0;
      }

        color: rgba(242, 244, 239, 0.92);
        font-size: clamp(24px, 3.2vw, 46px);
        font-weight: 300;
        letter-spacing: 0.18em;
        line-height: 1;
        text-transform: uppercase;
      }

      .contact-brand {
        margin-bottom: clamp(18px, 3vh, 28px);
        color: rgba(242, 244, 239, 0.58);
        font-family: "Noto Sans TC", "Source Han Sans TC", "PingFang TC", sans-serif;
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 300;
        letter-spacing: 0.12em;
        line-height: 1.5;
      }

      .sentence {
        display: grid;
        margin-top: clamp(42px, 7vh, 76px);
        font-size: clamp(18px, 2vw, 28px);
        font-weight: 300;
        line-height: 1.45;
      }

      .sentence span {
        grid-area: 1 / 1;
        color: var(--soft);
        letter-spacing: 0.018em;
        transition: opacity 800ms ease;
      }

      .sentence [lang="zh-Hant"] {
        color: rgba(242, 244, 239, 0.64);
        font-family: "Noto Sans TC", "Source Han Sans TC", "PingFang TC", sans-serif;
        font-weight: 300;
        letter-spacing: 0.04em;
        opacity: 0;
      }

      .sentence:hover [lang="en"],
      .sentence:focus-within [lang="en"] {
        opacity: 0;
      }

      .sentence:hover [lang="zh-Hant"],
      .sentence:focus-within [lang="zh-Hant"] {
        opacity: 1;
      }

      .contact-links {
        display: grid;
        gap: clamp(14px, 2.2vh, 22px);
        margin-top: clamp(54px, 9vh, 96px);
        color: var(--muted);
        font-size: clamp(13px, 1.1vw, 15px);
        letter-spacing: 0.12em;
        line-height: 1.5;
      }

      .social {
        display: flex;
        gap: clamp(24px, 4vw, 52px);
        margin-top: clamp(12px, 2vh, 22px);
      }

      .contact-links a,
      .contact-links span {
        opacity: 0.72;
        transition: opacity 300ms ease;
      }

      .contact-links a:hover,
      .contact-links a:focus-visible {
        opacity: 1;
        text-decoration: underline;
        text-underline-offset: 0.28em;
        text-decoration-thickness: 1px;
      }

      .services-list {
        display: grid;
        gap: 7px;
        margin-top: clamp(34px, 6vh, 62px);
        color: rgba(242, 244, 239, 0.48);
        font-family: "Noto Sans TC", "Source Han Sans TC", "PingFang TC", sans-serif;
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 300;
        letter-spacing: 0.04em;
        line-height: 1.55;
      }

      .services-list h2 {
        margin: 0 0 8px;
        color: rgba(242, 244, 239, 0.58);
        font-family: var(--font-en);
        font-size: clamp(12px, 1vw, 14px);
        font-weight: 400;
        letter-spacing: 0.16em;
        line-height: 1;
        text-transform: uppercase;
      }

      .services-list span {
        display: block;
      }

      .inquiry {
        width: min(100%, 480px);
        padding: clamp(18px, 2.4vw, 26px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.024);
        backdrop-filter: blur(18px);
        box-shadow: 0 34px 90px rgba(0, 0, 0, 0.22);
      }

      .inquiry h2 {
        margin: 0;
        color: rgba(242, 244, 239, 0.86);
        font-size: clamp(14px, 1.1vw, 17px);
        font-weight: 300;
        letter-spacing: 0.18em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .inquiry-intro {
        display: grid;
        gap: 4px;
        max-width: none;
        margin-top: 12px;
        color: rgba(242, 244, 239, 0.58);
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 300;
        letter-spacing: 0.018em;
        line-height: 1.55;
        white-space: nowrap;
      }

      .inquiry-form {
        display: grid;
        gap: clamp(14px, 2vw, 20px);
        margin-top: clamp(20px, 3.2vh, 30px);
      }

      .form-field {
        display: grid;
        gap: 10px;
        min-width: 0;
      }

      fieldset.form-field {
        gap: 12px;
      }

      .field-label,
      legend {
        display: block;
        width: 100%;
        padding: 0;
        color: rgba(242, 244, 239, 0.6);
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 400;
        letter-spacing: 0.14em;
        line-height: 1.3;
        text-transform: uppercase;
        white-space: nowrap;
        word-break: keep-all;
        overflow-wrap: normal;
      }

      fieldset {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .pill-group,
      .segment-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .budget-control {
        display: grid;
        gap: 10px;
      }

      .budget-value {
        color: rgba(242, 244, 239, 0.72);
        font-family: "Noto Sans TC", "Source Han Sans TC", "PingFang TC", sans-serif;
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 300;
        letter-spacing: 0.04em;
        line-height: 1.3;
      }

      input[type="range"] {
        width: 100%;
        height: 22px;
        margin: 0;
        accent-color: rgba(242, 244, 239, 0.82);
        background: transparent;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 1px;
        background: rgba(255, 255, 255, 0.24);
      }

      input[type="range"]::-webkit-slider-thumb {
        width: 15px;
        height: 15px;
        margin-top: -7px;
        border: 1px solid rgba(242, 244, 239, 0.72);
        border-radius: 50%;
        background: rgba(242, 244, 239, 0.82);
        appearance: none;
      }

      input[type="range"]::-moz-range-track {
        height: 1px;
        background: rgba(255, 255, 255, 0.24);
      }

      input[type="range"]::-moz-range-thumb {
        width: 15px;
        height: 15px;
        border: 1px solid rgba(242, 244, 239, 0.72);
        border-radius: 50%;
        background: rgba(242, 244, 239, 0.82);
      }

      .service-pill,
      .length-option,
      .budget-option {
        position: relative;
        display: inline-flex;
        align-items: center;
        min-height: 31px;
        padding: 0.58em 0.82em;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        color: rgba(242, 244, 239, 0.66);
        cursor: pointer;
        font-family: "Noto Sans TC", "Source Han Sans TC", "PingFang TC", sans-serif;
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 300;
        letter-spacing: 0.04em;
        line-height: 1;
        transition: color 280ms ease, border-color 280ms ease, background-color 280ms ease, box-shadow 280ms ease, opacity 280ms ease;
      }

      .service-pill input,
      .length-option input,
      .budget-option input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .service-pill:hover,
      .length-option:hover,
      .budget-option:hover {
        border-color: rgba(255, 255, 255, 0.22);
        color: rgba(242, 244, 239, 0.82);
      }

      .service-pill:has(input:checked),
      .length-option:has(input:checked),
      .budget-option:has(input:checked) {
        border-color: rgba(242, 244, 239, 0.72);
        background: rgba(242, 244, 239, 0.82);
        box-shadow: 0 0 34px rgba(120, 126, 86, 0.18);
        color: rgba(1, 2, 3, 0.88);
      }

      .service-pill:has(input:focus-visible),
      .length-option:has(input:focus-visible),
      .budget-option:has(input:focus-visible),
      input[type="range"]:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 1px solid rgba(218, 238, 232, 0.28);
        outline-offset: 4px;
      }

      input[type="text"],
      input[type="email"],
      textarea {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.2);
        color: rgba(242, 244, 239, 0.82);
        font: inherit;
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 300;
        letter-spacing: 0.035em;
        line-height: 1.5;
        padding: 11px 13px;
        transition: border-color 280ms ease, background-color 280ms ease;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      input::placeholder,
      textarea::placeholder {
        color: rgba(242, 244, 239, 0.36);
      }

      input[type="text"]:hover,
      input[type="email"]:hover,
      textarea:hover,
      input[type="text"]:focus,
      input[type="email"]:focus,
      textarea:focus {
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.26);
      }

      .form-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .submit-row {
        display: grid;
        gap: 12px;
        justify-items: start;
      }

      .form-status {
        min-height: 1.4em;
        color: rgba(242, 244, 239, 0.62);
        font-family: "Noto Sans TC", "Source Han Sans TC", "PingFang TC", sans-serif;
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 300;
        letter-spacing: 0.04em;
        line-height: 1.5;
      }

      .form-status.is-success {
        color: rgba(218, 238, 232, 0.82);
      }

      .form-status.is-error {
        color: rgba(242, 244, 239, 0.78);
      }

      .submit-actions {
        display: flex;
        justify-content: flex-start;
      }

      .submit-actions button {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.026);
        color: rgba(242, 244, 239, 0.76);
        cursor: pointer;
        font: inherit;
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 400;
        letter-spacing: 0.16em;
        line-height: 1;
        padding: 11px 16px;
        text-transform: uppercase;
        transition: color 280ms ease, border-color 280ms ease, background-color 280ms ease;
      }

      .submit-actions button:hover {
        border-color: rgba(255, 255, 255, 0.26);
        background: rgba(255, 255, 255, 0.04);
        color: rgba(242, 244, 239, 0.94);
      }

      .submit-actions button:disabled {
        cursor: wait;
        opacity: 0.48;
      }

      @media (max-width: 760px) {
        .site-nav {
          top: 32px;
          right: 20px;
          gap: 20px;
          font-size: 12px;
          letter-spacing: 0.14em;
        }

        main {
          padding-right: 20px;
          padding-left: 20px;
        }

        .wrap {
          grid-template-columns: 1fr;
          gap: 54px;
          align-items: start;
          padding-top: 104px;
          padding-bottom: 48px;
        }

        .contact-block {
          margin-left: 0;
        }

        .inquiry {
          margin-bottom: 0;
          padding: 20px;
          border-radius: 16px;
        }

        .inquiry-intro {
          white-space: normal;
        }

        .form-row {
          grid-template-columns: 1fr;
        }

        .form-field,
        fieldset.form-field,
        .form-row {
          display: block;
          width: 100%;
        }

        .field-label,
        legend {
          width: 100%;
          min-width: max-content;
          margin-bottom: 12px;
          white-space: nowrap;
          word-break: keep-all;
          overflow-wrap: normal;
        }

        .pill-group,
        .segment-group {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          width: 100%;
        }

        .form-row .form-field + .form-field,
        .inquiry-form > .form-field,
        .inquiry-form > fieldset.form-field,
        .submit-row {
          margin-top: 18px;
        }
      }
    </style>
  </head>

    <main>
      <div class="wrap">
        <section class="contact-block" aria-label="Contact">
          <p class="contact-brand" lang="zh-Hant">好述設計影像工作室</p>
          <h1>CONTACT</h1>
          <p class="sentence" tabindex="0">
            <span lang="en">Let’s build new ways of seeing.</span>
            <span lang="zh-Hant">關於新的觀看方式</span>
          </p>
          <div class="contact-links">
            <a href="mailto:sustudio2021@gmail.com">sustudio2021@gmail.com</a>
            <a href="tel:+886967266126">0967266126</a>
            <div class="social">
              <a href="https://lin.ee/uOrsZ8O" aria-label="Official LINE">LINE</a>
            </div>
          </div>
          <div class="services-list" aria-label="Services" lang="zh-Hant">
            <h2 lang="en">Services</h2>
            <span>影片剪輯</span>
            <span>Podcast剪輯</span>
            <span>聲音設計</span>
            <span>短影音製作</span>
            <span>訪談企劃</span>
            <span>商業影像製作</span>
          </div>
        </section>

        <section class="inquiry" aria-label="Project inquiry">
          <h2 lang="zh-Hant">專案詢問</h2>
          <p class="inquiry-intro">
            <span>告訴我們你正在規劃的內容</span>
            <span>我們會閱讀需求，並回覆適合的報價方向</span>
          </p>

          <form class="inquiry-form" id="projectInquiry" action="https://formspree.io/f/xojbbvvd" method="POST">
            <fieldset class="form-field">
              <legend>需要的服務</legend>
              <div class="pill-group">
                <label class="service-pill"><input type="checkbox" name="Services needed" value="影片剪輯" />影片剪輯</label>
                <label class="service-pill"><input type="checkbox" name="Services needed" value="拍攝" />拍攝</label>
                <label class="service-pill"><input type="checkbox" name="Services needed" value="Podcast 剪輯" />Podcast 剪輯</label>
                <label class="service-pill"><input type="checkbox" name="Services needed" value="空拍" />空拍</label>
                <label class="service-pill"><input type="checkbox" name="Services needed" value="其他" />其他</label>
              </div>
            </fieldset>

            <fieldset class="form-field">
              <legend>預計成片長度</legend>
              <div class="segment-group">
                <label class="length-option"><input type="radio" name="Expected final video length" value="1 分鐘以內" />1 分鐘以內</label>
                <label class="length-option"><input type="radio" name="Expected final video length" value="1–5 分鐘" />1–5 分鐘</label>
                <label class="length-option"><input type="radio" name="Expected final video length" value="5–10 分鐘" />5–10 分鐘</label>
                <label class="length-option"><input type="radio" name="Expected final video length" value="10–20 分鐘" />10–20 分鐘</label>
                <label class="length-option"><input type="radio" name="Expected final video length" value="20 分鐘以上" />20 分鐘以上</label>
                <label class="length-option"><input type="radio" name="Expected final video length" value="尚不確定" />尚不確定</label>
              </div>
            </fieldset>

            <fieldset class="form-field">
              <legend>預算範圍</legend>
              <div class="budget-control">
                <span class="budget-value" id="budgetValue">NT$ 50,000</span>
                <input type="range" id="budgetRange" min="1000" max="100000" step="1000" value="50000" aria-describedby="budgetValue" />
                <input type="hidden" name="Budget range" id="budgetRangeValue" value="NT$ 50,000" />
              </div>
              <div class="segment-group">
                <label class="budget-option"><input type="checkbox" id="budgetUndecided" name="Budget range" value="尚未確定" />尚未確定</label>
              </div>
            </fieldset>

            <div class="form-row">
              <label class="form-field">
                <span class="field-label">姓名 / 稱呼</span>
                <input type="text" name="Name" autocomplete="name" required />
              </label>
              <label class="form-field">
                <span class="field-label">聯絡方式</span>
                <input type="text" name="Contact method" placeholder="LINE / 電話 / Instagram" autocomplete="tel" required />
              </label>
            </div>

            <label class="form-field">
              <span class="field-label">電子信箱</span>
              <input type="email" name="Email" autocomplete="email" required />
            </label>

            <label class="form-field">
              <span class="field-label">其他需求</span>
              <textarea name="Special requirements" placeholder="可以告訴我們時程、參考作品、影片數量，或任何需要先知道的事情。"></textarea>
            </label>

            <div class="submit-row">
              <p class="form-status" id="inquiryStatus" aria-live="polite"></p>
              <div class="submit-actions">
                <button type="submit">送出詢問</button>
              </div>
            </div>
          </form>
        </section>
      </div>
    </main>
    <script>
      const inquiryForm = document.querySelector("#projectInquiry");
      const inquiryStatus = document.querySelector("#inquiryStatus");
      const submitButton = inquiryForm.querySelector("button[type='submit']");
      const serviceInputs = inquiryForm.querySelectorAll('input[name="Services needed"]');
      const lengthInputs = inquiryForm.querySelectorAll('input[name="Expected final video length"]');
      const budgetRange = document.querySelector("#budgetRange");
      const budgetValue = document.querySelector("#budgetValue");
      const budgetRangeValue = document.querySelector("#budgetRangeValue");
      const budgetUndecided = document.querySelector("#budgetUndecided");

      function formatBudget(value) {
        const amount = Number(value).toLocaleString("en-US");
        return Number(value) >= 100000 ? "NT$ 100,000+" : `NT$ ${amount}`;
      }

      function updateBudgetValue() {
        const formattedBudget = formatBudget(budgetRange.value);
        budgetValue.textContent = formattedBudget;
        budgetRangeValue.value = formattedBudget;
      }

      function setInquiryStatus(message, type) {
        inquiryStatus.textContent = message;
        inquiryStatus.classList.toggle("is-success", type === "success");
        inquiryStatus.classList.toggle("is-error", type === "error");
      }

      inquiryForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const selectedServices = [...serviceInputs].filter((input) => input.checked);
        if (!selectedServices.length) {
          setInquiryStatus("請至少選擇一項需要的服務。", "error");
          serviceInputs[0].focus();
          return;
        }

        const selectedLength = [...lengthInputs].find((input) => input.checked);
        if (!selectedLength) {
          setInquiryStatus("請選擇預計成片長度。", "error");
          lengthInputs[0].focus();
          return;
        }

        if (!inquiryForm.reportValidity()) return;

        const formData = new FormData(inquiryForm);
        formData.append("_subject", "專案詢問 - SU STUDIO");

        submitButton.disabled = true;
        setInquiryStatus("送出中...", "");

        try {
          const response = await fetch(inquiryForm.action, {
            method: "POST",
            body: formData,
            headers: {
              Accept: "application/json"
            }
          });

          if (!response.ok) throw new Error("Formspree request failed");

          inquiryForm.reset();
          budgetRange.disabled = false;
          budgetRangeValue.disabled = false;
          updateBudgetValue();
          setInquiryStatus("已收到您的需求，我們將盡快與您聯繫。", "success");
        } catch (error) {
          setInquiryStatus("送出失敗，請稍後再試或直接來信 sustudio2021@gmail.com", "error");
        } finally {
          submitButton.disabled = false;
        }
      });

      budgetRange.addEventListener("input", () => {
        if (budgetUndecided.checked) budgetUndecided.checked = false;
        updateBudgetValue();
      });

      budgetUndecided.addEventListener("change", () => {
        budgetRange.disabled = budgetUndecided.checked;
        budgetRangeValue.disabled = budgetUndecided.checked;
        budgetValue.textContent = budgetUndecided.checked ? "尚未確定" : formatBudget(budgetRange.value);
      });

      updateBudgetValue();
    </script>
  </body>
</html>
