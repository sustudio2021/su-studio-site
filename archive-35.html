    <main>
      <div class="wrap">
        <header class="archive-head">
          <a class="back" href="work.html" data-back-to-work>Back to Work</a>
          <h1 lang="zh-Hant">Ki戲人生</h1>
          <div class="archive-meta">
            <span>2026</span>
            <span>PODCAST</span>
            <span>Podcast and sound-based work</span>
          </div>
        </header>
        <section class="archive-section" aria-label="Ki戲人生 PODCAST archive">
          <h2 class="section-label">PODCAST</h2>
          <div class="video-grid">
            <article class="video-card">
              <button class="video-frame" type="button" data-embed="https://www.youtube.com/embed/3qnMtSTDL38" data-title="【 #Ki朴朴日常 】EP15︱韓國職棒初體驗" aria-label="Play 【 #Ki朴朴日常 】EP15︱韓國職棒初體驗">
                <img src="https://i.ytimg.com/vi/3qnMtSTDL38/hqdefault.jpg" alt="【 #Ki朴朴日常 】EP15︱韓國職棒初體驗" loading="lazy" />
              </button>
              <div class="video-meta"><span class="video-title">【 #Ki朴朴日常 】EP15︱韓國職棒初體驗</span><span class="year">2026</span></div>
            </article>
            <article class="video-card">
              <button class="video-frame" type="button" data-embed="https://www.youtube.com/embed/KNMr2p-0MSw" data-title="【 #Ki朴朴日常 】EP14︱香港好久不見" aria-label="Play 【 #Ki朴朴日常 】EP14︱香港好久不見">
                <img src="https://i.ytimg.com/vi/KNMr2p-0MSw/hqdefault.jpg" alt="【 #Ki朴朴日常 】EP14︱香港好久不見" loading="lazy" />

              <div class="video-meta"><span class="video-title">【 #Ki朴朴日常 】EP14︱香港好久不見</span><span class="year">2026</span></div>
            </article>
          </div>
        </section>
      </div>
    </main>
    <script>
      const backToWork = document.querySelector('[data-back-to-work]');
      if (backToWork) {
        backToWork.addEventListener('click', (event) => {
          const cameFromWork = document.referrer && document.referrer.includes('work.html');
          if (!cameFromWork) return;

          event.preventDefault();
          history.back();
        });
      }

      document.querySelectorAll('.video-frame').forEach((frame) => {
        frame.addEventListener('click', () => {
          const embed = frame.dataset.embed;
          const title = frame.dataset.title || 'SU STUDIO video';
          if (!embed || frame.classList.contains('is-playing')) return;

          const iframe = document.createElement('iframe');
          iframe.src = embed + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
          iframe.title = title;
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          iframe.allowFullscreen = true;

          frame.classList.add('is-playing');
          frame.replaceChildren(iframe);
        });
      });
    </script>
  </body>
